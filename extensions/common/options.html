<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จับคู่ QDM</title><link rel="stylesheet" href="extension.css"></head><body><main><div class="brand">QDM<span>QUEEN DOWNLOAD MANAGER</span></div><h1>จับคู่กับ QDM</h1><p>เปิด QDM → เชื่อมต่อเบราว์เซอร์ แล้วคัดลอกรหัสจับคู่มาใส่ที่นี่เพียงครั้งเดียว</p><form id="pair-form"><label>รหัสจับคู่<input id="token" type="password" autocomplete="off" required minlength="64" maxlength="64"></label><label>พอร์ต<input id="port" type="number" min="17876" max="17885" value="17876" required></label><button type="submit">บันทึกและทดสอบการเชื่อมต่อ</button></form><p id="message" role="status"></p><div class="note">QDM ต้องเปิดอยู่ • ส่วนเสริมส่งเฉพาะลิงก์ที่คุณสั่งดาวน์โหลด ไม่ส่งคุกกี้หรือรหัสผ่านของเว็บไซต์</div></main><script src="options.js"></script></body></html>
